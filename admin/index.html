<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>لوحة تحكم World PDF</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white">
<header class="border-b border-slate-800 bg-slate-900/80"><div class="mx-auto max-w-7xl px-4 py-5 flex items-center justify-between"><div><h1 class="text-2xl font-extrabold">لوحة تحكم World PDF</h1><p class="text-slate-400">المالك: عماد الدين لمراني</p></div><a href="/" class="rounded-lg border border-slate-700 px-4 py-2 hover:bg-slate-800">الموقع</a></div></header>
<main class="mx-auto max-w-7xl px-4 py-8">
<div id="error" class="hidden mb-6 rounded-xl border border-red-900 bg-red-950/40 p-4 text-red-200"></div>
<section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
<div class="rounded-2xl border border-slate-800 bg-slate-900 p-6"><p class="text-slate-400">إجمالي الزيارات</p><strong id="total" class="mt-2 block text-4xl">—</strong></div>
<div class="rounded-2xl border border-slate-800 bg-slate-900 p-6"><p class="text-slate-400">زيارات اليوم</p><strong id="today" class="mt-2 block text-4xl">—</strong></div>
<div class="rounded-2xl border border-slate-800 bg-slate-900 p-6"><p class="text-slate-400">المالك</p><strong class="mt-2 block text-xl">عماد الدين لمراني</strong></div>
<div class="rounded-2xl border border-slate-800 bg-slate-900 p-6"><p class="text-slate-400">قاعدة البيانات</p><strong class="mt-2 block text-xl">Cloudflare D1</strong></div>
</section>
<section class="mt-8 grid gap-6 lg:grid-cols-2"><div class="rounded-2xl border border-slate-800 bg-slate-900 p-6"><h2 class="mb-4 text-xl font-bold">أكثر الصفحات زيارة</h2><div id="paths" class="space-y-3 text-slate-300"></div></div><div class="rounded-2xl border border-slate-800 bg-slate-900 p-6"><h2 class="mb-4 text-xl font-bold">الدول</h2><div id="countries" class="space-y-3 text-slate-300"></div></div></section>
<div class="mt-8 rounded-2xl border border-amber-800 bg-amber-950/30 p-5 text-amber-100"><strong>أمان:</strong> احمِ مسار <code>/admin/*</code> وواجهات <code>/api/admin/*</code> بواسطة Cloudflare Zero Trust Access قبل الاستخدام الإنتاجي.</div>
</main>
<script>
const esc=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/admin/stats',{credentials:'include'});if(!r.ok)throw new Error('تعذر الوصول إلى قاعدة البيانات أو أن لوحة التحكم غير محمية عبر Cloudflare Access.');const d=await r.json();document.querySelector('#total').textContent=d.totalVisits.toLocaleString('ar');document.querySelector('#today').textContent=d.todayVisits.toLocaleString('ar');document.querySelector('#paths').innerHTML=d.topPaths.map(x=>`<div class="flex justify-between border-b border-slate-800 pb-2"><span>${esc(x.path)}</span><b>${x.count}</b></div>`).join('')||'<span>لا توجد بيانات</span>';document.querySelector('#countries').innerHTML=d.topCountries.map(x=>`<div class="flex justify-between border-b border-slate-800 pb-2"><span>${esc(x.country)}</span><b>${x.count}</b></div>`).join('')||'<span>لا توجد بيانات</span>';}catch(e){document.querySelector('#error').textContent=e.message;document.querySelector('#error').classList.remove('hidden')}}load();
</script>
</body></html>
