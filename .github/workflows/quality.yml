name: WPDF quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          find assets/js functions tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate required production files
        run: |
          test -f index.html
          test -f sw.js
          test -f manifest.webmanifest
          test -f schema.sql
          test -f wrangler.toml
          test -f assets/js/analytics.js
          test -f functions/api/visit.js
          test -f functions/api/tool-usage.js
          test -f functions/api/admin/stats.js
      - name: Run runtime integration test
        run: node tests/runtime-integration.mjs
